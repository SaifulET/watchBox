openapi: 3.1.0
info:
  title: WatchBox Customer API
  version: 0.1.0
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      tags: [Health]
      summary: Application health
      responses:
        "200":
          description: Application process is healthy.
  /health/live:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          description: API process is alive.
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        "200":
          description: Required backend dependencies are reachable.
        "503":
          description: One or more required backend dependencies are unavailable.
  /api/v1:
    get:
      tags: [Customer]
      summary: Customer API root
      responses:
        "200":
          description: Customer API metadata.
components:
  schemas:
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
        generatedAt:
          type: string
          format: date-time
